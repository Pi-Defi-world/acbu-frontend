name: Frontend QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  # AX-001: least-privilege token – read-only is enough for checkouts/builds.
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # AX-008: reject a drifted lockfile so installs are reproducible.
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run component tests
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E smoke tests
        run: pnpm test:e2e
