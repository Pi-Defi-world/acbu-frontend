# CI for acbu-zk — ZK circuits, Noir artifacts, Soroban verifier/gate contracts, SDK
# Triggered on every push/PR that touches zk-relevant paths, plus a weekly schedule
# for security audits.
#
# Jobs:
#   noir-build-test  — compile & test Noir circuits via nargo
#   noir-lint        — nargo fmt --check (formatting gate)
#   soroban-build    — cargo build (wasm32) for Soroban verifier/gate contracts
#   soroban-test     — cargo test for on-chain contract logic
#   cargo-audit      — rustsec advisory scan (security gate)
#   sdk-lint-test    — TypeScript/JS SDK lint + unit tests (if present)
#
# Required secrets (set in repo → Settings → Secrets):
#   None required by default; CARGO_REGISTRIES_CRATES_IO_PROTOCOL is set inline.
#
# See https://noir-lang.org/docs/getting_started/quick_start for nargo install docs.
# See https://soroban.stellar.org/docs for Soroban toolchain docs.

name: acbu-zk CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "circuits/**"
      - "contracts/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/acbu-zk-ci.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "circuits/**"
      - "contracts/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/acbu-zk-ci.yml"
  schedule:
    # Weekly security audit — every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Noir circuit build + tests
  # ───────────────────────────────────────────────────────────────────────────
  noir-build-test:
    name: Noir — build & test circuits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nargo (Noir toolchain)
        uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: stable

      - name: Cache Nargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.nargo
            target/
          key: nargo-${{ runner.os }}-${{ hashFiles('**/Nargo.toml') }}
          restore-keys: nargo-${{ runner.os }}-

      - name: Compile ZK comply circuit
        working-directory: circuits/zk_comply_circuit
        run: nargo compile

      - name: Run Noir circuit tests
        working-directory: circuits/zk_comply_circuit
        run: nargo test

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Noir formatting lint
  # ───────────────────────────────────────────────────────────────────────────
  noir-lint:
    name: Noir — formatting lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nargo (Noir toolchain)
        uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: stable

      - name: Check Noir formatting
        working-directory: circuits/zk_comply_circuit
        run: nargo fmt --check

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Soroban verifier/gate contract build (wasm32)
  # ───────────────────────────────────────────────────────────────────────────
  soroban-build:
    name: Soroban contracts — cargo build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Stellar CLI (soroban)
        run: |
          cargo install --locked stellar-cli --features opt

      - name: Build Soroban contracts
        run: |
          stellar contract build

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Soroban contract tests (native target, not wasm)
  # ───────────────────────────────────────────────────────────────────────────
  soroban-test:
    name: Soroban contracts — cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Run contract unit tests
        run: cargo test --workspace

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Security audit (RustSec + cargo-deny)
  # ───────────────────────────────────────────────────────────────────────────
  cargo-audit:
    name: Security — cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # ───────────────────────────────────────────────────────────────────────────
  # 6. SDK lint + unit tests (TypeScript/JS SDK, if present)
  # ───────────────────────────────────────────────────────────────────────────
  sdk-lint-test:
    name: SDK — lint & unit tests
    runs-on: ubuntu-latest
    # Only run if the sdk/ directory exists
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for SDK directory
        id: sdk-check
        run: |
          if [ -d "sdk" ] && [ -f "sdk/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.sdk-check.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.sdk-check.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install SDK dependencies
        if: steps.sdk-check.outputs.exists == 'true'
        working-directory: sdk
        run: pnpm install

      - name: Lint SDK
        if: steps.sdk-check.outputs.exists == 'true'
        working-directory: sdk
        run: pnpm lint

      - name: Test SDK
        if: steps.sdk-check.outputs.exists == 'true'
        working-directory: sdk
        run: pnpm test

      - name: No SDK found — skipping
        if: steps.sdk-check.outputs.exists == 'false'
        run: echo "sdk/package.json not found — SDK job skipped."
